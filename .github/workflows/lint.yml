name: Lint & Code Quality Check

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  lint:
    name: Lint & Style Standards
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Linters
        run: |
          python -m pip install --upgrade pip
          pip install ruff black flake8

      - name: Run Ruff Linter
        run: |
          ruff check opticparse-py/src/ opticparse-py/tests/ || true

      - name: Run Flake8 Standards
        run: |
          flake8 opticparse-py/src/ --count --max-line-length=127 --statistics || true
